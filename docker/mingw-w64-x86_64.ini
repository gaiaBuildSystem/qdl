[binaries]
c = 'x86_64-w64-mingw32-gcc'
ar = 'x86_64-w64-mingw32-ar'
strip = 'x86_64-w64-mingw32-strip'
windres = 'x86_64-w64-mingw32-windres'
pkg-config = 'pkg-config'

[properties]
pkg_config_libdir = '/opt/deps/lib/pkgconfig'

[built-in options]
# The static libxml2 archive must not be referenced via __declspec(dllimport).
c_args = ['-DLIBXML_STATIC']
c_link_args = ['-static']

[host_machine]
system = 'windows'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
